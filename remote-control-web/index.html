<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AHK 遠端控制台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>AHK 遠端控制台</h1>
    <p class="sub">Firestore 多機控制（MVP）</p>

    <section class="card" id="controlCard">
      <label for="pcDropdown">在線電腦</label>
      <select id="pcDropdown"></select>
      <p class="sub">會顯示目前執行步驟與伺服器狀態</p>

      <div class="row buttons">
        <button id="btnPause" class="warn">暫停</button>
        <button id="btnRun" class="ok">啟動</button>
        <button id="btnStop" class="danger">關閉腳本</button>
      </div>

      <p id="statusMsg" class="msg"></p>
      <ul id="clientMeta"></ul>
    </section>
  </main>

  <script type="module" src="app.js?v=20260718-1"></script>
</body>
</html>
